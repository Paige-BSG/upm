name: harness

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  harness:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "22.23.2"
          cache: npm
          cache-dependency-path: harness/package-lock.json
      - run: node --experimental-strip-types scripts/check_no_comments.ts .
      - run: node --experimental-strip-types scripts/check_invariant_ids.ts .
      - run: node --experimental-strip-types scripts/check_public_secrets.ts .
      - run: npm ci
        working-directory: harness
      - run: npm run typecheck
        working-directory: harness
      - run: npm test
        working-directory: harness
